services:
  postgres:
    image: postgres:16
    container_name: forgemind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: forgemind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - type: bind
        source: ${FORGEMIND_POSTGRES_DATA_DIR:-D:/DockerData/forgemind/postgres}
        target: /var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forgemind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
